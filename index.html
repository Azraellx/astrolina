<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The page's language, declared before anything else runs (2026-10-09). A browser decides
         whether to offer translating the page from the language the page declares as it loads,
         so declaring it once the bundle has run (i18n/runtime.ts does, after the engine) is too
         late: a Spanish reader in our Spanish catalog would already have been offered a machine
         translation of it. And CSS casing needs it from the first paint — Turkish uppercase
         gives İ only under lang="tr".

         It resolves the language exactly as the runtime does: the stored choice
         (astro:locale:v2) if it is an available language, else the browser's first language
         that is, else English; then the tag that language is declared as. AVAILABLE and
         DECLARED are copies, because nothing can be imported here: AVAILABLE is
         SUPPORTED_LOCALES (i18n/catalog.ts — the languages.ts entries marked available) and
         DECLARED is DECLARED_LANG (i18n/runtime.ts). Enabling a language means adding it to
         AVAILABLE too; `npm run verify:lang-boot` fails until the copies agree, and runs this
         script against the runtime to prove the two resolve alike. Both are written as JSON
         so that check can read them. It reads storage and never writes it.

         While the new languages are held for their release (i18n/languageHold.ts, 2026-10-10),
         HELD narrows AVAILABLE to English unless this device holds the hold's unlock key, so the
         page is declared English from the first paint, as the runtime will declare it. HELD is a
         copy of HELD_BASE and the key a copy of UNLOCK_KEY; verify:lang-boot fails until both
         equal them. Lifting the hold deletes HELD and its test from both copies. -->
    <script id="lang-boot">
      (function () {
        var AVAILABLE = ["en", "es", "pt", "tr", "de", "ru"];
        var DECLARED = {"pt": "pt-BR"};
        // The release hold (i18n/languageHold.ts): held, and not unlocked on this device, English
        // is the only language, narrowed here before anything below reads the list. Unreadable
        // storage reads as locked, as it does in the runtime.
        var HELD = true;
        if (HELD) {
          var unlocked = false;
          try {
            unlocked = localStorage.getItem('astro:languages-unlock:v1') === '1';
          } catch (e) {}
          if (!unlocked) AVAILABLE = ["en"];
        }
        var pick = null;
        // Whether this device had used the app before anything after this script runs - an existing
        // install, for the language-detected notice (i18n/runtime.ts hasOtherState). Taken here
        // because a module may write a key of its own while it loads, which made every first visit
        // look like a return (2026-10-09). Reads storage, never writes it.
        try {
          var had = false;
          for (var k = 0; k < localStorage.length && !had; k++) {
            var key = localStorage.key(k);
            if (key && key.indexOf('astro:') === 0 && key !== 'astro:locale:v2') had = true;
          }
          window.__astroHadState = had;
        } catch (e) {}
        try {
          var stored = localStorage.getItem('astro:locale:v2');
          if (stored && AVAILABLE.indexOf(stored) >= 0) pick = stored;
        } catch (e) {}
        if (!pick) {
          try {
            var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
            for (var i = 0; i < langs.length && !pick; i++) {
              var base = String(langs[i] || '').toLowerCase().split('-')[0];
              if (AVAILABLE.indexOf(base) >= 0) pick = base;
            }
          } catch (e) {}
        }
        if (!pick) pick = 'en';
        document.documentElement.lang = Object.prototype.hasOwnProperty.call(DECLARED, pick) ? DECLARED[pick] : pick;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <!-- viewport-fit=cover fills the notch / safe areas edge-to-edge. user-scalable=no blocks
         accidental PAGE pinch-zoom on Android (the map keeps its own pinch on its canvas).
         We deliberately do NOT set minimum/maximum-scale: locking the scale range breaks the
         iOS *standalone* (home-screen) app in landscape — the layout viewport ends up wider
         than the screen, so fixed HUD elements detach from the edges and the page scrolls
         horizontally. (iOS ignores user-scalable=no, so page zoom there is left to Safari.) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AstroLina Cartography</title>
    <meta
      name="description"
      content="A modern, open-source astrocartography tool for curious minds. Plot a chart's planetary lines on an interactive world map, drag to relocate, and explore transits, progressions, and synastry."
    />
    <meta name="theme-color" content="#0a0a0f" />
    <!-- Installable web app (PWA) — run standalone from the home screen / dock. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    />
    <meta property="og:image" content="https://maps.astrolina.org/images/astrolina-banner-v1.jpg" />

    <!-- Twitter / X -->

    <style>
      /* First-paint loading screen (replaced by the React app once the Swiss
         Ephemeris WASM + data finish loading). Inlined so it shows instantly. */
      html, body { background: #0b0e14; margin: 0; }
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: radial-gradient(130% 120% at 50% 32%, #161c2b 0%, #0b0e14 58%);
        color: #cdd4e2;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        opacity: 1;
        transition: opacity 0.24s ease;
      }
      #loading-screen .ls-orb {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 2px solid rgba(245, 184, 61, 0.85);
        box-shadow: 0 0 26px 2px rgba(245, 184, 61, 0.22),
          inset 0 0 14px rgba(245, 184, 61, 0.18);
        animation: ls-pulse 2.2s ease-in-out infinite;
      }
      #loading-screen .ls-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #eef1f6;
        padding-left: 0.34em;
      }
      #loading-screen .ls-track {
        width: 190px;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #loading-screen .ls-bar {
        height: 100%;
        width: 0;
        border-radius: 3px;
        background: linear-gradient(90deg, #f5b83d, #f3cd7a);
        transition: width 0.25s ease-out, background 0.2s;
      }
      #loading-screen .ls-status {
        font-size: 11.5px;
        letter-spacing: 0.02em;
        color: #7c8698;
        min-height: 15px;
        max-width: 280px;
        text-align: center;
        padding: 0 16px;
      }
      @keyframes ls-pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.55; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading-screen .ls-orb { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading-screen">
        <div class="ls-orb"></div>
        <div class="ls-title" lang="en">AstroLina</div>
        <div class="ls-track"><div class="ls-bar" id="ls-bar"></div></div>
        <div class="ls-status" id="ls-status">Loading…</div>
      </div>
    </div>
    <script>
      // Start the progress bar immediately at page load — so it moves while the
      // JS bundle (incl. the map engine) downloads, not just after it runs. The
      // bar eases asymptotically toward ~94%; main.tsx then drives the status
      // through real stages and snaps it to 100% when the engine is ready.
      (function () {
        var w = window;
        w.__load = { start: performance.now(), done: false, floor: 0 };
        var bar = document.getElementById('ls-bar');
        var st = document.getElementById('ls-status');
        var taken = false;
        w.__loadTaken = function () { taken = true; };
        setTimeout(function () {
          if (!taken && st) st.textContent = 'Loading map & engine…';
        }, 2500);
        function tick() {
          var L = w.__load;
          if (L.done) return;
          var t = performance.now() - L.start;
          var pct = Math.max(94 * (1 - Math.exp(-t / 3600)), L.floor);
          if (bar) bar.style.width = pct.toFixed(1) + '%';
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
